name: CI app build

on:
  workflow_dispatch:
    inputs:
      build_version:
        type: string
        description: Build version
        required: true
      source_branch:
        type: string
        description: Source branch
        required: true
      
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID2 }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY2 }}
      AWS_REGION: us-west-2
      REACT_APP_ENV: Staging
      REACT_APP_URL: https://totembound-test.net
      REACT_APP_CDN_URL: https://cdn.totembound-test.net
      REACT_APP_API_ENDPOINT: https://api.totembound-test.net/v1
      REACT_APP_IPFS_GATEWAY_URL: https://ipfs.totembound.com/ipfs/
      REACT_APP_VERSION: ${{ github.event.inputs.build_version }}

    steps:
    - name: Checkout contracts repo
      uses: actions/checkout@v3
      with:
        repository: totembound/totem-contracts
        path: totem-contracts

    - name: Checkout app branch
      uses: actions/checkout@v3
      with:
        repository: totembound/totem-app
        ref: ${{ github.event.inputs.source_branch }}
        token: ${{ secrets.PAT }}
        path: totem-app

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install contracts dependencies
      working-directory: ./totem-contracts
      run: npm install
    
    - name: Compile Contracts
      working-directory: ./totem-contracts
      run: npx hardhat compile

    - name: Export Contract ABIs
      working-directory: ./totem-contracts
      run: npx hardhat export-abi

    - name: Install
      working-directory: ./totem-app
      run: npm install

    - name: Build
      working-directory: ./totem-app
      env:
        CI: false
      run: npm run build

    - name: Zip release
      working-directory: ./totem-app
      run: zip -r release-${{ github.event.inputs.build_version }}.zip ./build

    - name: Push to S3
      working-directory: ./totem-app
      run: aws s3 sync . s3://totemboundci-releases/totem-app --exclude "*" --include "release-${{ github.event.inputs.build_version }}.zip"
      