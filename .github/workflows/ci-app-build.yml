name: CI app build

on:
  workflow_dispatch:
    inputs:
      build_version:
        type: string
        description: Build version
        required: true
      source_branch:
        type: string
        description: App source branch
        required: true
        default: main
      api_branch:
        type: string
        description: API branch (for OpenAPI spec)
        required: true
        default: main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID2 }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY2 }}
      AWS_REGION: us-west-2
      ENVIRONMENT: staging
      VITE_API_URL: https://api.totembound-test.net/v1
      VITE_VERSION: ${{ github.event.inputs.build_version }}
      VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY_STAGING }}
      VITE_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
      VITE_PUBLIC_POSTHOG_AUTOCAPTURE: 'false'
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID_STAGING }}
      VITE_TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID_STAGING }}

    steps:
    - name: Checkout app repo
      uses: actions/checkout@v4
      with:
        repository: totembound/totem-app
        ref: ${{ github.event.inputs.source_branch }}
        token: ${{ secrets.PAT }}
        path: totem-app

    - name: Checkout API repo (for OpenAPI spec)
      uses: actions/checkout@v4
      with:
        repository: totembound/totem-api
        ref: ${{ github.event.inputs.api_branch }}
        token: ${{ secrets.PAT }}
        path: totem-api

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate OpenAPI spec
      working-directory: ./totem-api
      run: |
        npm install swagger-jsdoc
        node scripts/export-openapi.js ../totem-app/public/docs/openapi.json

    - name: Install dependencies
      working-directory: ./totem-app
      run: npm ci

    - name: Check types
      working-directory: ./totem-app
      run: npm run check-types

    - name: Run ESLint
      working-directory: ./totem-app
      run: npm run lint

    - name: Run tests
      working-directory: ./totem-app
      run: npm run test:ci

    - name: Build
      working-directory: ./totem-app
      run: npm run build

    - name: Zip release
      working-directory: ./totem-app
      run: zip -r release-${{ github.event.inputs.build_version }}.zip ./build

    - name: Push to S3
      working-directory: ./totem-app
      run: aws s3 sync . s3://totemboundci-releases/totem-app --exclude "*" --include "release-${{ github.event.inputs.build_version }}.zip"
