name: CI app deploy

on:
  workflow_dispatch:
    inputs:
      release_version:
        type: string
        description: Release version
        required: true
      
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID2 }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY2 }}
      AWS_REGION: us-west-2

    steps:
    - name: Get from S3
      run: aws s3 sync s3://totemboundci-releases . --exclude "*" --include "totem-app/release-${{ github.event.inputs.release_version }}.zip"
    - name: Unzip release
      working-directory: ./totem-app
      run: unzip release-${{ github.event.inputs.release_version }}.zip
    - name: Sync to app S3
      working-directory: ./totem-app
      run: aws s3 sync build s3://totemboundci-app
    - name: Refresh Cloudfront
      run: aws cloudfront create-invalidation --distribution-id E30D3Q6UOWWMO4 --paths "/*"
